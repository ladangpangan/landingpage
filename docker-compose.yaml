services:
  landing:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      MONGO_URL: ${MONGO_URL:-}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ladang_landing}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      ERP_INTEGRATION_URL: ${ERP_INTEGRATION_URL:-}
      ERP_INTEGRATION_KEY: ${ERP_INTEGRATION_KEY:-}

volumes:
  uploads_data:
