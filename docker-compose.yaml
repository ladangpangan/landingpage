services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-landing_app}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD wajib diisi}

  landing:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      # Hanya untuk pengecekan dari dalam VPS; trafik publik lewat Traefik.
      - "127.0.0.1:3002:3000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-landing_app}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-ladang_landing}
      ADMIN_OWNER_EMAIL: ${ADMIN_OWNER_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      NEXT_PUBLIC_MIDTRANS_CLIENT_KEY: ${NEXT_PUBLIC_MIDTRANS_CLIENT_KEY:-}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      ERP_INTEGRATION_URL: ${ERP_INTEGRATION_URL:-}
      ERP_INTEGRATION_KEY: ${ERP_INTEGRATION_KEY:-}
    # Traefik (sudah terpasang di VPS KVM 2) mengurus HTTPS dan arah trafik.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ladang-landing.rule=Host(`marketplace.ladangpangan.id`)"
      - "traefik.http.routers.ladang-landing.entrypoints=websecure"
      - "traefik.http.routers.ladang-landing.tls=true"
      - "traefik.http.routers.ladang-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.ladang-landing.loadbalancer.server.port=3000"

volumes:
  uploads_data:
  mongo_data:
